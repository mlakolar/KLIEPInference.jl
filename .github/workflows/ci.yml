name: Testing

on:
  - push
  - pull_request

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        version:
          - '1.10'
          - '1'
        os:
          - ubuntu-latest
          #- macOS-latest
          #- windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # CoordinateDescent 0.8 and its unregistered solver dependency.
      - name: Install the coordinated API update
        shell: julia --project=. {0}
        run: |
          using Pkg
          Pkg.add([PackageSpec(url="https://github.com/mlakolar/ProximalBase.jl", rev="master"),
                   PackageSpec(url="https://github.com/mlakolar/ProximalSolvers.jl", rev="master"),
                   PackageSpec(url="https://github.com/mlakolar/CoordinateDescent.jl", rev="codex/issue-40-julia-naming")])
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v1
        with:
          file: lcov.info      